deno = 'latest'
dotnet = 'latest'
eza = "latest"
go = 'latest'
node = 'latest'
python = 'latest'
ruby = 'latest'
rust = 'latest'
# tree-sitter = 'latest'

[settings]
activate_aggressive = true
always_keep_install = false
asdf_compat = false
disable_hints = ['python_multi']
env_file = '.env'
experimental = true
go_set_gopath = false
go_set_goroot = false
go_skip_checksum = true
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]
legacy_version_file = true
not_found_auto_install = true
paranoid = false
raw = false
trusted_config_paths = ['~/code', '~/src']
verbose = false
yes = false

[settings.task]
output = 'prefix'
